name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
  build:
    needs: setup
    strategy:
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-15-intel
            binary: openmw_pincushion_generator
            archive: openmw_pincushion_generator_${{github.ref_name}}_macos_x86_64.zip
          - os: macos-latest
            binary: openmw_pincushion_generator
            archive: openmw_pincushion_generator_${{github.ref_name}}_macos_arm64.zip
          - os: ubuntu-latest
            binary: openmw_pincushion_generator
            archive: openmw_pincushion_generator_${{github.ref_name}}_ubuntu_x86_64.zip
          - os: windows-latest
            binary: openmw_pincushion_generator.exe
            archive: openmw_pincushion_generator_${{github.ref_name}}_windows_x86_64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly

      - name: build
        run: cargo build --release

      - name: compress
        run: 7z a -tzip ${{matrix.archive}} ./target/release/${{matrix.binary}}

      - name: upload
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ matrix.archive }}
